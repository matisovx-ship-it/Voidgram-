# --- БЛОК 26/30: DOCKER-COMPOSE ДЛЯ BACKEND + REDIS + POSTGRESQL ---
# Збережіть цей блок у файл: docker-compose.yml

version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - STRIPE_SECRET_KEY=sk_live_your_stripe_key
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgres://voiduser:voidpass@db:5432/voidgram_db
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voiduser
      POSTGRES_PASSWORD: voidpass
      POSTGRES_DB: voidgram_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
  
